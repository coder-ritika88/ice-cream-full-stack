<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}{% endblock title %} Welcome to my ice cream parlour</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Carousel Image CSS -->
  <style>
    .carousel-img {
      height: 650px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg" style="background-color: pink;">
    <div class="container-fluid px-0">

      <a class="navbar-brand fw-bold" href="/">Ice Creams</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active fw-bold" aria-current="page" href="/">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-bold" href="/about">
              About Us
            </a>
          </li>

          <li class="nav-item dropdown">

            <a
              class="nav-link dropdown-toggle fw-bold"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              Services
            </a>

            <ul class="dropdown-menu">

              <li>
                <a class="dropdown-item" href="/services">
                  Softy
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="/services">
                  Ice Cream
                </a>
              </li>

              <li>
                <a class="dropdown-item" href="/services">
                  Family Pack
                </a>
              </li>

            </ul>

          </li>

          <li class="nav-item">
            <a class="nav-link fw-bold" href="/contact">
              Contact Us
            </a>
          </li>

        </ul>

        <form class="d-flex" role="search">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search"
            aria-label="Search">

          <button class="btn btn-outline-success" type="submit">
            Search
          </button>
        </form>

      </div>
    </div>
  </nav>

  {% block body %}{% endblock body %}

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
